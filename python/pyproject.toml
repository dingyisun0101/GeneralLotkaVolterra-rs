[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "general-lotka-volterra-reader"
version = "0.5.1"
description = "Official Python payload decoders for GLV Workflow recordings"
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
dependencies = [
  "numpy>=2,<3",
  "scientific-workflow>=0.5,<0.6",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
general_lotka_volterra_reader = ["py.typed"]
