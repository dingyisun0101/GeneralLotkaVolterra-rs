[package]
name = "general-lotka-volterra-rs"
version = "0.17.1"
edition = "2024"
rust-version = "1.97"
autoexamples = false
description = "General Lotka-Volterra and replicator models built on Scientific Workflow"
readme = "README.md"
license = "MIT OR Apache-2.0"
repository = "https://github.com/dingyisun0101/GeneralLotkaVolterra-rs/"
homepage = "https://github.com/dingyisun0101/GeneralLotkaVolterra-rs/"
documentation = "https://github.com/dingyisun0101/GeneralLotkaVolterra-rs/"
keywords = ["physics", "ecology", "math", "scientific", "sde"]
categories = ["science"]
include = [
    "src/*.rs",
    "src/**/*.rs",
    "!src/target/**",
    "tests/**/*.rs",
    "README.md",
    "tools/*.py",
]

[workspace]
resolver = "3"

[dependencies]
ecological-state-toolkit = { version = "0.12.2", path = "../eco_core" }
physics_in_parallel = "3.7.0"
scientific-workflow = "0.13.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
