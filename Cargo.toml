[package]
name = "general-lotka-volterra-rs"
version = "0.3.0"
edition = "2024"
rust-version = "1.97"
autoexamples = false
description = "General Lotka-Volterra and replicator models built on Scientific Workflow"
readme = "README.md"
license = "MIT OR Apache-2.0"
repository = "https://github.com/dingyisun0101/GeneralLotkaVolterra-rs/"
homepage = "https://github.com/dingyisun0101/GeneralLotkaVolterra-rs/"
documentation = "https://github.com/dingyisun0101/GeneralLotkaVolterra-rs/"
keywords = ["physics", "ecology", "math", "scientific", "sde"]
categories = ["science"]
include = [
    "src/*.rs",
    "src/**/*.rs",
    "!src/target/**",
    "schemas/*.json",
    "README.md",
    "examples/*/main.rs",
    "examples/support.rs",
    "examples/*/config/*.json",
    "examples/*/inputs/*.json",
    "examples/*/*.py",
    "tools/*.py",
]

[dependencies]
ndarray = { version = "0.17.2", features = ["serde"] }
rand = "0.10"
rand_chacha = "0.10"
rand_distr = "0.6"
scientific-workflow = "0.1.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
thiserror = "2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

[[example]]
name = "mean_field_replicator"
path = "examples/mean_field_replicator/main.rs"

[[example]]
name = "mean_field_replicator_demographic"
path = "examples/mean_field_replicator_demographic/main.rs"

[[example]]
name = "spatial_replicator"
path = "examples/spatial_replicator/main.rs"

[[example]]
name = "spatial_general_lotka_volterra"
path = "examples/spatial_general_lotka_volterra/main.rs"

[[example]]
name = "ground_truth_comparison"
path = "examples/ground_truth_comparison/main.rs"
