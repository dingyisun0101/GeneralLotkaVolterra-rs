[package]
name = "general-lotka-volterra-rs"
version = "0.10.1"
edition = "2024"
rust-version = "1.97"
autoexamples = false
description = "General Lotka-Volterra and replicator models built on Scientific Workflow"
readme = "README.md"
license = "MIT OR Apache-2.0"
repository = "https://github.com/dingyisun0101/GeneralLotkaVolterra-rs/"
homepage = "https://github.com/dingyisun0101/GeneralLotkaVolterra-rs/"
documentation = "https://github.com/dingyisun0101/GeneralLotkaVolterra-rs/"
keywords = ["physics", "ecology", "math", "scientific", "sde"]
categories = ["science"]
include = [
    "src/*.rs",
    "src/**/*.rs",
    "!src/target/**",
    "schemas/*.json",
    "README.md",
    "tools/*.py",
]

[workspace]
members = [
    "examples/mean_field_replicator",
    "examples/mean_field_replicator_demographic",
    "examples/spatial_replicator",
    "examples/spatial_general_lotka_volterra",
]
default-members = ["."]
resolver = "3"

[dependencies]
ecological-model-core = { path = "../eco_core", version = "0.5.0" }
ndarray = { version = "0.17.2", features = ["serde"] }
physics_in_parallel = { path = "../pip", version = "3.3.0"}
scientific-workflow = { path = "../workflow/rust", version = "0.6.2" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
thiserror = "2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
